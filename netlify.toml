[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/adin-proxy"
  to = "/.netlify/functions/adin-proxy"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/gallery"
  to = "/.netlify/functions/gallery"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

[[redirects]]
  from = "/api/wheel"
  to = "/.netlify/functions/wheel"
  status = 200
